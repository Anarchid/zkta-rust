when:
  event: [push, tag, pull_request]
  branch: main

matrix:
  platform:
    - linux/amd64
  RUST: [stable, nightly]

steps:
  test:
    image: rust
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - rustup default $RUST
      - rustup update
      - rustup component add clippy
      - cargo clippy-all && cargo clippy-all-middle
      - cargo test-all && cargo test-all-middle
