[alias]
test-all = "test --all"
test-all-middle = "test --all --features=linkedlist_midpoint"
test-console = "test --features=console_debug"
clippy-all = "clippy --all --all-targets"
clippy-all-middle = "clippy --all --all-targets --features=linkedlist_midpoint"
fmt-all = "fmt --all"
run-main = "run --example main"
doc-all = "rustdoc --features=linkedlist_midpoint"
