[package]
name = "zkta-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "zkta"
path = "src/lib.rs"

[[bin]]
name = "zkta-rs"
path = "src/main.rs"
required-features = ["render"]

[features]
default = ["render"]
# Diagnostic image rendering, image-based input, and the zkta-rs CLI.
# Library users that only need the analysis (e.g. a game AI) can disable it.
render = ["dep:image", "dep:imageproc", "dep:serde", "dep:serde_json"]

[dependencies]
boostvoronoi = "0.12"
rstar = "0.12"
geo = "0.29"
log = "0.4"
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[patch.crates-io]
# Deterministic skip-list levels for boostvoronoi; see vendor/cpp_map.
cpp_map = { path = "../vendor/cpp_map" }
