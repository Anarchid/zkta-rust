[package]
name = "zkta-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "zkta"
path = "src/lib.rs"

[[bin]]
name = "zkta-rs"
path = "src/main.rs"

[dependencies]
boostvoronoi = "0.12"
rstar = "0.12"
geo = "0.29"
image = "0.25"
imageproc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
